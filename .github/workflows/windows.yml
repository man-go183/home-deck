name: windows-exe

# Manual only: run from the Actions tab when the code is ready.
# Nothing builds on push/upload.
on:
  workflow_dispatch:

jobs:
  exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build native blocker (Rust)
        shell: pwsh
        run: |
          cargo build --release --manifest-path src/native/hdblock/Cargo.toml
          New-Item -ItemType Directory -Force src/HomeDeck/runtimes/win-x64/native | Out-Null
          Copy-Item src/native/hdblock/target/release/hdblock.dll src/HomeDeck/runtimes/win-x64/native/hdblock.dll

      - name: Publish unpackaged exe
        run: dotnet publish src/HomeDeck/HomeDeck.csproj -f net10.0-windows10.0.19041.0 -c Release -p:WindowsPackageType=None

      - name: Zip output
        shell: pwsh
        run: |
          $pub = Get-ChildItem src/HomeDeck/bin/Release/net10.0-windows10.0.19041.0 -Recurse -Directory -Filter "publish" | Select-Object -First 1
          if (-not $pub) { throw "publish folder not found" }
          Compress-Archive -Path "$($pub.FullName)/*" -DestinationPath out-homedeck-windows.zip

      - name: Upload exe zip
        uses: actions/upload-artifact@v4
        with:
          name: homedeck-windows
          path: out-homedeck-windows.zip

  # Packaged MSIX for sideloading (self-signed). Needed for capabilities
  # that require package identity: notification-listener, bluetooth,
  # location. Users install CERT-INSTALL.txt's cert once, then the msix.
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-windows

      - name: Build native blocker (Rust)
        shell: pwsh
        run: |
          cargo build --release --manifest-path src/native/hdblock/Cargo.toml
          New-Item -ItemType Directory -Force src/HomeDeck/runtimes/win-x64/native | Out-Null
          Copy-Item src/native/hdblock/target/release/hdblock.dll src/HomeDeck/runtimes/win-x64/native/hdblock.dll

      - name: Create self-signed cert (CN must match appxmanifest Publisher)
        shell: pwsh
        run: |
          $cert = New-SelfSignedCertificate -Type Custom -Subject "CN=HomeDeck" `
            -KeyUsage DigitalSignature -FriendlyName "HomeDeck Sideload" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -NotAfter (Get-Date).AddYears(10) `
            -KeyAlgorithm RSA -KeyLength 2048 -HashAlgorithm SHA256 `
            -TextExtension @("2.5.29.37={text}1.3.6.1.5.5.7.3.3")
          Export-Certificate -Cert $cert -FilePath out-HomeDeck.cer | Out-Null
          "THUMB=$($cert.Thumbprint)" | Out-File $env:GITHUB_ENV -Append

      - name: Publish MSIX
        run: dotnet publish src/HomeDeck/HomeDeck.csproj -f net10.0-windows10.0.19041.0 -c Release -p:WindowsPackageType=MSIX -p:AppxPackageSigningEnabled=true -p:PackageCertificateThumbprint=${{ env.THUMB }}

      - name: Collect MSIX bundle
        shell: pwsh
        run: |
          $msix = Get-ChildItem src/HomeDeck/AppPackages -Recurse -File -Filter "*.msix" | Select-Object -First 1
          if (-not $msix) { throw "msix not found" }
          New-Item -ItemType Directory -Force out-msix | Out-Null
          Copy-Item $msix.FullName out-msix/HomeDeck.msix
          Copy-Item out-HomeDeck.cer out-msix/HomeDeck.cer
          Copy-Item CERT-INSTALL.txt out-msix/CERT-INSTALL.txt

      - name: Upload MSIX bundle
        uses: actions/upload-artifact@v4
        with:
          name: homedeck-windows-msix
          path: out-msix/*
