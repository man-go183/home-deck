name: android-apk

# Manual only: run from the Actions tab when the code is ready.
# Nothing builds on push/upload.
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: "Build configuration"
        type: choice
        default: Debug
        options: [Debug, Release]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Install MAUI workload
        run: dotnet workload install maui-android

      - name: Native blocker unit tests
        run: cargo test --manifest-path src/native/hdblock/Cargo.toml

      - name: Build native blocker (Rust for Android)
        run: |
          rustup target add aarch64-linux-android x86_64-linux-android
          NDK_BIN="${ANDROID_NDK_HOME:-$ANDROID_NDK_ROOT}/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$NDK_BIN/aarch64-linux-android24-clang"
          export CARGO_TARGET_X86_64_LINUX_ANDROID_LINKER="$NDK_BIN/x86_64-linux-android24-clang"
          cargo build --release --manifest-path src/native/hdblock/Cargo.toml --target aarch64-linux-android
          cargo build --release --manifest-path src/native/hdblock/Cargo.toml --target x86_64-linux-android
          mkdir -p src/HomeDeck/runtimes/android-arm64/native src/HomeDeck/runtimes/android-x64/native
          cp src/native/hdblock/target/aarch64-linux-android/release/libhdblock.so src/HomeDeck/runtimes/android-arm64/native/
          cp src/native/hdblock/target/x86_64-linux-android/release/libhdblock.so src/HomeDeck/runtimes/android-x64/native/

      - name: Build APK
        run: dotnet build src/HomeDeck/HomeDeck.csproj -f net10.0-android -c ${{ inputs.configuration }} -p:RunAotCompilation=false -p:EnableWindowsTargeting=true

      - name: Collect APK
        run: |
          mkdir -p out
          find src/HomeDeck/bin/${{ inputs.configuration }}/net10.0-android -name '*.apk' -exec cp {} out/ \;
          ls -la out

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: homedeck-android-${{ inputs.configuration }}
          path: out/*.apk
